<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
 <title>QuickTable - Cliente</title>
 <style>
 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
 }

 body {
 background: linear-gradient(160deg, #fef3e8 0%, #ffe8d6 30%, #fdf0e6 70%, #fff8f0 100%);
 min-height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 padding: 20px;
 }

 .screen {
 background: rgba(255, 255, 255, 0.85);
 backdrop-filter: blur(20px);
 -webkit-backdrop-filter: blur(20px);
 border-radius: 32px;
 max-width: 480px;
 width: 100%;
 min-height: 600px;
 box-shadow: 0 8px 32px rgba(200, 120, 50, 0.12);
 overflow: hidden;
 transition: all 0.2s ease;
 display: flex;
 flex-direction: column;
 }

 .header {
 background: #d95c0e;
 color: white;
 padding: 20px;
 text-align: center;
 font-weight: bold;
 font-size: 1.5rem;
 }

 .content {
 flex: 1;
 padding: 20px;
 overflow-y: auto;
 }

 .footer {
 padding: 15px;
 background: #faf3ed;
 border-top: 1px solid #f0e2d5;
 font-size: 0.8rem;
 text-align: center;
 color: #9a7a64;
 }

 button {
 background: #d95c0e;
 border: none;
 color: white;
 padding: 12px 20px;
 border-radius: 48px;
 font-weight: bold;
 font-size: 1rem;
 cursor: pointer;
 transition: 0.2s;
 width: 100%;
 margin: 8px 0;
 }

 button:active {
 transform: scale(0.97);
 background: #c04e08;
 }

 .btn-secondary {
 background: #a08470;
 }

 .btn-secondary:active {
 background: #8a7060;
 }

 .btn-outline {
 background: transparent;
 border: 2px solid #d95c0e;
 color: #d95c0e;
 }

 .btn-success {
 background: #2b8c3e;
 }

 .btn-success:active {
 background: #1f6d2e;
 }

 .option-grid {
 display: flex;
 flex-direction: column;
 gap: 12px;
 margin: 20px 0;
 }

 .card-item {
 background: rgba(255,255,255,0.9);
 border-radius: 20px;
 padding: 16px;
 margin-bottom: 12px;
 box-shadow: 0 2px 8px rgba(180,100,40,0.06);
 border: 1px solid #f0e2d5;
 display: flex;
 justify-content: space-between;
 align-items: center;
 }

 .item-info h3 {
 font-size: 1.1rem;
 }

 .item-info p {
 font-size: 0.8rem;
 color: #8a7a6a;
 }

 .price {
 font-weight: bold;
 color: #d95c0e;
 }

 .add-btn {
 background: #d95c0e;
 border: none;
 color: white;
 width: 40px;
 height: 40px;
 border-radius: 40px;
 font-size: 1.5rem;
 font-weight: bold;
 cursor: pointer;
 }

 .cart-summary {
 background: #fef6ed;
 border-radius: 20px;
 padding: 16px;
 margin-top: 20px;
 border: 1px solid #f5e3d5;
 }

 .alert {
 background: #eaf7ed;
 color: #1f6d2e;
 padding: 12px;
 border-radius: 20px;
 text-align: center;
 margin-bottom: 20px;
 }

 .welcome-badge {
 background: rgba(217, 92, 14, 0.06);
 padding: 12px;
 border-radius: 24px;
 margin-bottom: 20px;
 border-left: 4px solid #d95c0e;
 }

 .hidden {
 display: none;
 }

 .back-button {
 background: none;
 color: #d95c0e;
 text-align: left;
 font-weight: normal;
 padding: 6px 0;
 }

 hr {
 margin: 16px 0;
 border: none;
 border-top: 1px solid #f0e2d5;
 }
 </style>
</head>
<body>
<div class="screen" id="app">
 <div class="header">🍽️ QuickTable</div>
 <div class="content" id="mainContent">
 <!-- Contenido dinámico -->
 </div>
 <div class="footer">Cliente | Mesa virtual</div>
</div>

<script>
 const cartaData = {
 entradas: [
 { id: 1, nombre: "🍟 Papas bravas", precio: 4.90, descripcion: "Con salsa picante y alioli" },
 { id: 2, nombre: "🥗 Ensalada César", precio: 6.50, descripcion: "Pollo, parmesano, aderezo César" }
 ],
 principales: [
 { id: 3, nombre: "🍔 Hamburguesa Clásica", precio: 9.90, descripcion: "Carne 180gr, queso, lechuga, tomate" },
 { id: 4, nombre: "🍝 Lomo saltado", precio: 12.90, descripcion: "Lomo, cebolla, tomate, papas, arroz" },
 { id: 5, nombre: "🥩 Picanha a la parrilla", precio: 15.90, descripcion: "Con guarnición y chimichurri" }
 ],
 postres: [
 { id: 6, nombre: "🍰 Tarta de queso", precio: 4.50, descripcion: "Con coulis de frutos rojos" },
 { id: 7, nombre: "🍫 Volcán de chocolate", precio: 5.20, descripcion: "Con helado de vainilla" }
 ],
 bebidas: [
 { id: 8, nombre: "🥤 Gaseosa", precio: 2.50, descripcion: "Personal 400ml" },
 { id: 9, nombre: "🍺 Cerveza artesanal", precio: 4.00, descripcion: "Rubia 500ml" }
 ]
 };

 let currentUser = null;
 let currentOrder = [];
 let currentScreen = "auth";
 let orderConfirmed = false;

 function render() {
 const container = document.getElementById("mainContent");
 if (currentScreen === "auth") renderAuth(container);
 else if (currentScreen === "main") renderMainMenu(container);
 else if (currentScreen === "menuCarta") renderCarta(container);
 else if (currentScreen === "confirmMozo") renderMozo(container);
 else if (currentScreen === "confirmCuenta") renderCuenta(container);
 }

 // ─── AUTH ───────────────────────────────────────────────────────────
 function renderAuth(container) {
 container.innerHTML = `
 <div style="text-align:center; padding:20px 0;">
 <div style="font-size:3.5rem;">🍽️</div>
 <h2 style="margin:8px 0 4px;">QuickTable</h2>
 <p style="color:#8a7a6a; font-size:0.9rem;">Tu menú digital</p>
 </div>
 <div class="option-grid" id="authButtons">
 <button id="loginBtn">🔐 Iniciar sesión</button>
 <button id="registerBtn" class="btn-outline">📝 Registrarse</button>
 <button id="guestBtn" class="btn-outline" style="border-color:#a08470; color:#a08470;">👤 Continuar como invitado</button>
 </div>

 <!-- Login form -->
 <div id="loginForm" class="hidden" style="margin-top:16px;">
 <input type="text" id="loginId" placeholder="ID de usuario" style="width:100%; padding:12px; border-radius:48px; border:1px solid #e0d5ca; background:#faf6f2; margin-bottom:8px;">
 <input type="password" id="loginPass" placeholder="Contraseña" style="width:100%; padding:12px; border-radius:48px; border:1px solid #e0d5ca; background:#faf6f2; margin-bottom:12px;">
 <button id="doLoginBtn">Ingresar</button>
 <button id="cancelLoginBtn" class="btn-secondary">Cancelar</button>
 </div>

 <!-- Register form -->
 <div id="registerForm" class="hidden" style="margin-top:16px;">
 <input type="text" id="regId" placeholder="ID de usuario" style="width:100%; padding:12px; border-radius:48px; border:1px solid #e0d5ca; background:#faf6f2; margin-bottom:8px;">
 <input type="password" id="regPass" placeholder="Contraseña" style="width:100%; padding:12px; border-radius:48px; border:1px solid #e0d5ca; background:#faf6f2; margin-bottom:8px;">
 <input type="text" id="regName" placeholder="Nombre" style="width:100%; padding:12px; border-radius:48px; border:1px solid #e0d5ca; background:#faf6f2; margin-bottom:8px;">
 <input type="text" id="regLastName" placeholder="Apellido" style="width:100%; padding:12px; border-radius:48px; border:1px solid #e0d5ca; background:#faf6f2; margin-bottom:8px;">
 <input type="email" id="regEmail" placeholder="Correo electrónico" style="width:100%; padding:12px; border-radius:48px; border:1px solid #e0d5ca; background:#faf6f2; margin-bottom:8px;">
 <label style="font-size:0.85rem; color:#8a7a6a; margin-left:8px;">Fecha de nacimiento</label>
 <input type="date" id="regBirth" style="width:100%; padding:12px; border-radius:48px; border:1px solid #e0d5ca; background:#faf6f2; margin-bottom:12px; color:#666;">
 <button id="doRegisterBtn">Crear cuenta</button>
 <button id="cancelRegisterBtn" class="btn-secondary">Cancelar</button>
 </div>
 `;

 document.getElementById("loginBtn")?.addEventListener("click", () => {
 document.getElementById("authButtons")?.classList.add("hidden");
 document.getElementById("loginForm")?.classList.remove("hidden");
 });
 document.getElementById("cancelLoginBtn")?.addEventListener("click", () => {
 document.getElementById("authButtons")?.classList.remove("hidden");
 document.getElementById("loginForm")?.classList.add("hidden");
 });
 document.getElementById("doLoginBtn")?.addEventListener("click", () => {
 const id = document.getElementById("loginId")?.value.trim();
 if (!id) { alert("Ingresa tu ID de usuario"); return; }
 currentUser = { id, nombre: id, email: id + "@mail.com", esPreferencial: true };
 currentOrder = []; orderConfirmed = false;
 currentScreen = "main";
 render();
 });
 document.getElementById("registerBtn")?.addEventListener("click", () => {
 document.getElementById("authButtons")?.classList.add("hidden");
 document.getElementById("registerForm")?.classList.remove("hidden");
 });
 document.getElementById("cancelRegisterBtn")?.addEventListener("click", () => {
 document.getElementById("authButtons")?.classList.remove("hidden");
 document.getElementById("registerForm")?.classList.add("hidden");
 });
 document.getElementById("doRegisterBtn")?.addEventListener("click", () => {
 const id = document.getElementById("regId")?.value.trim();
 const pass = document.getElementById("regPass")?.value.trim();
 const name = document.getElementById("regName")?.value.trim();
 const lastName = document.getElementById("regLastName")?.value.trim();
 const email = document.getElementById("regEmail")?.value.trim();
 const birth = document.getElementById("regBirth")?.value;
 if (!id || !pass || !name || !lastName || !email || !birth) {
 alert("Completa todos los campos para registrarte.");
 return;
 }
 currentUser = { id, nombre: name + " " + lastName, email, pass, birth, esPreferencial: false };
 currentOrder = []; orderConfirmed = false;
 currentScreen = "main";
 render();
 });
 document.getElementById("guestBtn")?.addEventListener("click", () => {
 currentUser = null; currentOrder = []; orderConfirmed = false;
 currentScreen = "main";
 render();
 });
 }

 // ─── MAIN MENU ──────────────────────────────────────────────────────
 function renderMainMenu(container) {
 let userInfo = '';
 if (currentUser) {
 userInfo = `<div class="welcome-badge"><strong>✨ ¡Hola ${currentUser.nombre}!</strong><br><small>Según tus consumos previos, tienes un 10% OFF en tu próxima bebida. 🎁</small></div>`;
 } else {
 userInfo = `<div class="alert">👋 Estás como invitado. Regístrate para recibir promos.</div>`;
 }

 let orderPreview = '';
 if (currentOrder.length > 0) {
 const totalItems = currentOrder.reduce((s, i) => s + i.cantidad, 0);
 const totalPrice = currentOrder.reduce((s, i) => s + (i.precio * i.cantidad), 0).toFixed(2);
 orderPreview = `<div class="cart-summary">🛒 Pedido actual: ${totalItems} productos · $${totalPrice}<br><small>Ve a "Carta" para agregar más</small></div>`;
 if (orderConfirmed) orderPreview += `<div class="alert" style="margin-top:8px;">✅ Pedido confirmado. El mozo lo está preparando.</div>`;
 } else {
 orderPreview = `<div class="cart-summary">🛒 Tu pedido está vacío.</div>`;
 }

 container.innerHTML = `
 ${userInfo}
 <div class="option-grid">
 <button id="btnCarta">📖 Ver carta</button>
 <button id="btnMozo">🛎️ Llamar al mozo</button>
 <button id="btnCuenta">💰 Pedir cuenta</button>
 </div>
 ${orderPreview}
 `;
 document.getElementById("btnCarta")?.addEventListener("click", () => { currentScreen = "menuCarta"; render(); });
 document.getElementById("btnMozo")?.addEventListener("click", () => { currentScreen = "confirmMozo"; render(); });
 document.getElementById("btnCuenta")?.addEventListener("click", () => { currentScreen = "confirmCuenta"; render(); });
 }

 // ─── CARTA ──────────────────────────────────────────────────────────
 function renderCarta(container) {
 let html = `<button id="backToMain" class="back-button">← Volver al menú</button>`;
 html += `<h3 style="margin:12px 0 0 0">📋 Nuestra Carta</h3>`;

 const categorias = [
 { nombre: "🥗 Entradas", items: cartaData.entradas },
 { nombre: "🍽️ Platos principales", items: cartaData.principales },
 { nombre: "🍰 Postres", items: cartaData.postres },
 { nombre: "🥤 Bebidas", items: cartaData.bebidas }
 ];

 for (let cat of categorias) {
 html += `<h4 style="margin-top:20px;">${cat.nombre}</h4>`;
 for (let item of cat.items) {
 html += `<div class="card-item"><div class="item-info"><h3>${item.nombre}</h3><p>${item.descripcion}</p><span class="price">$${item.precio.toFixed(2)}</span></div><button class="add-btn" data-id="${item.id}" data-nombre="${item.nombre}" data-precio="${item.precio}">+</button></div>`;
 }
 }

 // Resumen del pedido
 let summary = `<div class="cart-summary" style="margin-top:24px;"><strong>🧾 Mi pedido</strong>`;
 if (currentOrder.length === 0) {
 summary += `<p style="margin-top:8px;color:#8a7a6a;">No hay productos agregados.</p>`;
 } else {
 currentOrder.forEach(item => {
 summary += `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;"><span>${item.cantidad}x ${item.nombre}</span><span>$${(item.precio * item.cantidad).toFixed(2)}</span></div>`;
 });
 const total = currentOrder.reduce((s, i) => s + (i.precio * i.cantidad), 0).toFixed(2);
 summary += `<hr><strong>Total: $${total}</strong>`;
 }
 summary += `</div>`;

 html += summary;
 html += `<button id="sendOrderBtn" class="btn-success" style="margin-top:12px;">📤 Solicitar pedido</button>`;
 html += `<button id="clearOrderBtn" class="btn-secondary">🗑️ Vaciar pedido</button>`;

 container.innerHTML = html;

 document.querySelectorAll(".add-btn").forEach(btn => {
 btn.addEventListener("click", () => {
 const id = parseInt(btn.dataset.id);
 const nombre = btn.dataset.nombre;
 const precio = parseFloat(btn.dataset.precio);
 const existing = currentOrder.find(i => i.id === id);
 if (existing) existing.cantidad += 1;
 else currentOrder.push({ id, nombre, precio, cantidad: 1 });
 orderConfirmed = false;
 renderCarta(container);
 });
 });
 document.getElementById("backToMain")?.addEventListener("click", () => { currentScreen = "main"; render(); });
 document.getElementById("clearOrderBtn")?.addEventListener("click", () => {
 if (confirm("¿Vaciar todo el pedido?")) { currentOrder = []; orderConfirmed = false; renderCarta(container); }
 });
 document.getElementById("sendOrderBtn")?.addEventListener("click", () => {
 if (currentOrder.length === 0) { alert("Agrega productos primero."); return; }
 orderConfirmed = true;
 alert("✅ Pedido enviado. Un mozo pasará a reconfirmar tu orden.");
 currentScreen = "main";
 render();
 });
 }

 // ─── MOZO ───────────────────────────────────────────────────────────
 function renderMozo(container) {
 container.innerHTML = `
 <button id="backMain" class="back-button">← Volver al menú</button>
 <div style="text-align:center; margin-top:40px;">
 <div style="font-size:4rem;">🛎️</div>
 <h2>Solicitud enviada</h2>
 <p>Un mozo se acercará a tu mesa en breve.</p>
 <div class="alert">✅ Notificación enviada al sistema de atención.</div>
 <button id="okMozoBtn" class="btn-outline">Entendido</button>
 </div>
 `;
 document.getElementById("backMain")?.addEventListener("click", () => { currentScreen = "main"; render(); });
 document.getElementById("okMozoBtn")?.addEventListener("click", () => { currentScreen = "main"; render(); });
 }

 // ─── CUENTA ─────────────────────────────────────────────────────────
 function renderCuenta(container) {
 let total = currentOrder.reduce((s, i) => s + (i.precio * i.cantidad), 0).toFixed(2);
 let itemsHtml = "";
 if (currentOrder.length === 0) {
 itemsHtml = "<p style='color:#8a7a6a;'>No has agregado productos aún.</p>";
 } else {
 currentOrder.forEach(item => {
 itemsHtml += `<div>${item.cantidad}x ${item.nombre} = $${(item.precio * item.cantidad).toFixed(2)}</div>`;
 });
 }
 container.innerHTML = `
 <button id="backMain" class="back-button">← Volver al menú</button>
 <h3>🧾 Resumen de consumo</h3>
 ${itemsHtml}
 <hr>
 <h3>Total: $${total}</h3>
 <div class="alert" style="margin-top:20px;">💳 Puedes pagar con tarjeta, efectivo o QR.</div>
 <button id="requestBillBtn">Solicitar cuenta final</button>
 <p style="font-size:0.75rem; margin-top:12px; color:#8a7a6a;">*Un mozo se acercará con el comprobante.</p>
 `;
 document.getElementById("backMain")?.addEventListener("click", () => { currentScreen = "main"; render(); });
 document.getElementById("requestBillBtn")?.addEventListener("click", () => {
 alert("✅ Cuenta solicitada. El mozo llevará el detalle a tu mesa.");
 });
 }

 render();
</script>
</body>
</html>
